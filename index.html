<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="משחק מפעיל רחפנים: תקיפה, סיוע לכוחות, חילוץ חטופים וסיור">
<title>DroneStrike</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#070b09;--panel:#0d1411;--panel2:#121c18;--line:#22332b;--line2:#2f4a3d;--txt:#dce8df;--dim:#86998d;--acc:#5ef59a;--acc2:#27b863;--warn:#ffb347;--bad:#ff5a4f;--friend:#5cc2ff;--gold:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.hidden{display:none!important}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#hud .pe,#hud button{pointer-events:auto}
.hb{background:rgba(6,12,9,.72);border:1px solid var(--line2);border-radius:10px;min-width:48px;height:44px;padding:0 9px;font-size:13px;font-weight:600;color:var(--txt);display:flex;align-items:center;justify-content:center;gap:5px;line-height:1.05;text-align:center}
.hb:active{transform:scale(.95)}
.hb.on{border-color:var(--acc);color:var(--acc);background:rgba(20,60,35,.72)}
.hb.dis{opacity:.42}
.hb.alert{border-color:var(--bad);color:#fff;animation:pulse .45s infinite alternate}
@keyframes pulse{from{background:rgba(70,0,0,.6)}to{background:rgba(190,25,25,.85)}}
#topbar{position:absolute;top:calc(6px + env(safe-area-inset-top));left:calc(6px + env(safe-area-inset-left));right:calc(6px + env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
#timer{font:700 19px/1 ui-monospace,Menlo,Consolas,monospace;padding:7px 12px;background:rgba(6,12,9,.72);border:1px solid var(--line2);border-radius:10px;min-width:86px;text-align:center;direction:ltr}
#timer.low{color:var(--bad);border-color:var(--bad)}
#objBox{position:absolute;top:calc(56px + env(safe-area-inset-top));right:calc(6px + env(safe-area-inset-right));width:min(300px,72vw);background:rgba(6,12,9,.88);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5;z-index:3}
#objBox h4{margin:0 0 3px;font-size:12px;color:var(--acc)}
#objBox .o::before{content:"▢ ";color:var(--dim)}
#objBox .o.done{color:var(--acc)}#objBox .o.done::before{content:"✔ ";color:var(--acc)}
#objBox .o.opt{color:#b9c7be}#objBox .o.opt::before{content:"◇ "}
#objBox .o.opt.done{color:var(--acc)}#objBox .o.opt.done::before{content:"✔ "}
#objBox .o.fail{color:var(--bad);text-decoration:line-through}#objBox .o.fail::before{content:"✖ "}
#msgs{position:absolute;top:calc(56px + env(safe-area-inset-top));left:calc(132px + env(safe-area-inset-left));right:calc(6px + env(safe-area-inset-right));display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.msg{background:rgba(6,12,9,.84);border-inline-start:3px solid var(--acc);padding:5px 10px;border-radius:6px;font-size:12.5px;line-height:1.35;transition:opacity .6s}
@media (min-width:900px) and (min-height:521px){#msgs{left:50%;right:auto;transform:translateX(-50%);width:min(480px,46vw);top:calc(98px + env(safe-area-inset-top));align-items:center}.msg{font-size:13px;text-align:center}}
.msg.warn{border-color:var(--warn)}.msg.bad{border-color:var(--bad);color:#ffd6d3}.msg.friend{border-color:var(--friend);color:#d5eeff}.msg.good{border-color:var(--acc);color:#d4ffe4}
#mini{position:absolute;left:calc(6px + env(safe-area-inset-left));top:calc(56px + env(safe-area-inset-top));width:118px;height:118px;border:1px solid var(--line2);border-radius:8px;background:#000}
#leftCol{position:absolute;left:calc(6px + env(safe-area-inset-left));top:calc(182px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px}
#rightCol{position:absolute;right:calc(6px + env(safe-area-inset-right));bottom:calc(104px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#weapRow{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));left:calc(6px + env(safe-area-inset-left));right:104px;display:flex;gap:6px;flex-wrap:wrap-reverse;direction:ltr}
.wb{flex-direction:column;gap:2px;height:52px;min-width:64px}
.wb small{font-size:11px;font-weight:500;color:var(--dim)}
.wb.on small{color:var(--acc)}
#fireBtn{position:absolute;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:82px;height:82px;border-radius:50%;background:rgba(110,8,8,.6);border:2px solid var(--bad);color:#fff;font-weight:800;font-size:18px;letter-spacing:1px}
#fireBtn.held{background:rgba(220,30,30,.85)}
#banner{position:absolute;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(6,12,9,.88);border:1px solid var(--acc);color:var(--acc);padding:7px 14px;border-radius:8px;font-size:13px;white-space:nowrap}
@media (max-height:520px){
  .hb{height:38px;min-width:44px;font-size:12px}
  .wb{height:44px;min-width:58px}
  #mini{width:92px;height:92px}
  #leftCol{top:calc(154px + env(safe-area-inset-top));gap:5px}
  #rightCol{bottom:calc(92px + env(safe-area-inset-bottom));gap:5px}
  #weapRow{left:calc(62px + env(safe-area-inset-left))}
  #fireBtn{width:72px;height:72px}
  #msgs{top:calc(52px + env(safe-area-inset-top));left:calc(112px + env(safe-area-inset-left));right:auto;transform:none;width:min(420px,max(250px,calc(100vw - 440px)));align-items:flex-start}
  .msg{font-size:12px;padding:4px 9px;text-align:right}
  #objBox{top:calc(50px + env(safe-area-inset-top));width:min(290px,38vw);font-size:11.5px;line-height:1.35;padding:6px 9px}
  #rightCol .hb{height:36px}
  #banner{bottom:calc(64px + env(safe-area-inset-bottom))}
}
/* ---------- מסכים ---------- */
.screen{position:fixed;inset:0;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(4,8,6,.5),rgba(4,8,6,.9))}
.wrap{max-width:1000px;margin:0 auto}
.logo{font:800 clamp(36px,9vw,70px)/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:4px;color:var(--acc);text-shadow:0 0 22px rgba(94,245,154,.35);direction:ltr;text-align:center;margin-top:9vh}
.sub{color:var(--dim);text-align:center;margin:12px 0 30px;font-size:15px}
.menu{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;color:var(--txt);text-align:center}
.btn:hover{border-color:var(--acc2)}
.btn.pri{background:linear-gradient(180deg,#1f6b41,#145232);border-color:var(--acc2);color:#eafff1}
.btn.red{background:#4a1412;border-color:#8a2a24}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hdr .t{font:800 22px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--acc);direction:ltr}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px}
.chip b{color:var(--gold)}
.chip b.neg{color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px;overflow-x:auto}
.tab{padding:9px 16px;border-radius:9px;font-weight:700;font-size:14.5px;color:var(--dim);border:1px solid transparent;white-space:nowrap}
.tab.on{color:var(--acc);border-color:var(--line2);background:var(--panel)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;display:flex;flex-direction:column;gap:7px}
.card.click{cursor:pointer;transition:border-color .15s}
.card.click:hover{border-color:var(--acc2)}
.card h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.ic{font-size:18px;color:var(--acc);min-width:32px;height:32px;border:1px solid var(--line2);border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.card p{margin:0;color:#b8c7bd;font-size:13.5px;line-height:1.45}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:#0a110e;border:1px solid var(--line);color:var(--dim)}
.tag.n{color:#a9b8ff}.tag.w{color:var(--warn)}.tag.g{color:var(--acc)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{color:var(--gold);font-weight:700}
.lvl{display:flex;gap:3px}.lvl i{width:16px;height:5px;border-radius:2px;background:#24332b}.lvl i.f{background:var(--acc)}
.sec{margin:18px 0 8px;font-size:13px;color:var(--acc);letter-spacing:.5px;font-weight:700}
.modal{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:10px;touch-action:pan-y}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(580px,100%);max-height:100%;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet .x{float:left;font-size:22px;color:var(--dim);width:34px;height:34px}
.diffs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.diff{padding:9px 2px;border-radius:8px;border:1px solid var(--line);background:#0a110e;font-size:12.5px;font-weight:700;color:var(--dim)}
.diff.on{border-color:var(--acc);color:var(--acc);background:#10261a}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13.5px;margin:10px 0}
.stat span{color:var(--dim)}
.slotRow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.slotRow .nm{flex:1;font-size:14px}
.slotRow .nm small{display:block;color:var(--dim);font-size:11.5px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-weight:800;font-size:16px}
.step button:disabled{opacity:.35}
.step b{min-width:20px;text-align:center}
.dlist{display:flex;flex-direction:column;gap:6px}
.dopt{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#0a110e;text-align:right;width:100%}
.dopt.on{border-color:var(--acc)}
.dopt small{color:var(--dim)}
.res{font-size:14px;width:100%;border-collapse:collapse;margin:10px 0}
.res td{padding:6px 2px;border-bottom:1px dashed var(--line)}
.res td:last-child{text-align:left;direction:ltr;font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
.pos{color:var(--acc)}.neg{color:var(--bad)}
.big{font-size:28px;font-weight:800;margin:6px 0}
.help p,.help li{font-size:14px;line-height:1.65;color:#c4d2c8}
.help h3{color:var(--acc);font-size:15px;margin:16px 0 4px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px dashed var(--line);font-size:15px}
.note{font-size:12.5px;color:var(--dim);line-height:1.5}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;background:#10261a;border:1px solid var(--acc2);color:#dfffea;padding:9px 16px;border-radius:10px;font-size:14px;transition:opacity .4s;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="topbar">
    <button class="hb" id="objBtn">יעדים</button>
    <div id="timer">00:00</div>
    <button class="hb" id="pauseBtn" aria-label="השהיה">❚❚</button>
  </div>
  <div id="objBox" class="pe hidden"></div>
  <div id="msgs"></div>
  <canvas id="mini" class="pe" width="240" height="240"></canvas>
  <div id="leftCol">
    <button class="hb" id="zIn" aria-label="זום פנימה">＋</button>
    <button class="hb" id="zOut" aria-label="זום החוצה">－</button>
    <button class="hb" id="thBtn">תרמי</button>
    <button class="hb" id="markBtn">סמן</button>
  </div>
  <div id="rightCol">
    <button class="hb" id="flareBtn">נוריות <b id="flareN">0</b></button>
    <button class="hb" id="altBtn">גובה: נמוך</button>
    <button class="hb" id="orbitBtn">הזז מסלול</button>
    <button class="hb" id="airBtn">תקיפת מטוס <b id="airN">0</b></button>
  </div>
  <div id="weapRow"></div>
  <button id="fireBtn">אש</button>
  <div id="banner" class="hidden"></div>
</div>

<div id="screen" class="screen"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="hidden"></div>

<script>
'use strict';
/* =====================================================================
   DroneStrike — משחק מפעיל רחפנים. קובץ יחיד, בלי ספריות ובלי build.
   ===================================================================== */
const GAME_NAME = 'DroneStrike';
const SAVE_KEY = 'dsSave', SET_KEY = 'dsSettings', SAVE_VERSION = 2;
const WORLD = 1500;          // גודל המפה ביחידות (בערך מטרים)
const VIEW_UNITS = 640;      // כמה יחידות רואים בצד הקצר של המסך בזום x1

/* ---------- עזרים ---------- */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = Math.random;
const rnd = (a = 1, b) => b === undefined ? R() * a : a + R() * (b - a);
const rint = (a, b) => Math.floor(a + R() * (b - a + 1));
const pick = a => a[Math.floor(R() * a.length)];
const chance = p => R() < p;
const gauss = () => (R() + R() + R() - 1.5) / 1.5;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function angLerp(a, b, t) { let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * clamp(t, 0, 1); }
function segDist(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy || 1; const t = clamp(((px - ax) * dx + (py - ay) * dy) / L, 0, 1); return { d: Math.hypot(px - ax - dx * t, py - ay - dy * t), t }; }
function circRect(x, y, r, b) { const cx = clamp(x, b.x, b.x + b.w), cy = clamp(y, b.y, b.y + b.h); return (x - cx) ** 2 + (y - cy) ** 2 <= r * r; }
const fmtMoney = n => (n < 0 ? '-' : '') + '₪' + Math.abs(Math.round(n)).toLocaleString('en-US');
const mmss = s => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ---------- נתוני משחק ---------- */
// light = מכפיל נזק נגד רכבים ומבנים קלים, bdmg = מכפיל נזק נגד בניינים ומטרות מבוצרות
const WEAPONS = {
  grenade: { name: 'רימון מונחה', short: 'רימון', cls: 1, radius: 6, dmg: 170, light: 0.8, bdmg: 0.3, flight: 2.4, spread: 1.3, cd: 0.8, wt: 1, step: 1, price: 0, pack: 0, free: true,
    desc: 'נופל אנכית מהרחפן והורג מטווח של כמה מטרים. חינם וללא הגבלה במלאי.' },
  gun: { name: 'מקלע 7.62', short: 'מקלע', cls: 2, radius: 1.5, dmg: 42, light: 0.15, bdmg: 0.03, flight: 0.5, spread: 1.5, cd: 0.11, wt: 0.04, step: 50, price: 90, pack: 150, auto: true,
    desc: 'אש רציפה נגד חמושים, כמעט בלי נזק סביבתי. מצוין ליד חטופים וכוחות.' },
  missile: { name: 'טיל נ״ט מונחה', short: 'טיל', cls: 2, radius: 6.5, dmg: 260, light: 1, bdmg: 0.8, flight: 2.2, spread: 0.8, cd: 1.4, wt: 5, step: 1, price: 260, pack: 2, laser: true,
    desc: 'טיל מדויק נגד רכבים ומשגרים. עם מסמן לייזר הוא ננעל על מטרה בתנועה.' },
  loiter: { name: 'תחמושת משוטטת', short: 'משוטטת', cls: 1, radius: 4, dmg: 240, light: 1, bdmg: 0.5, flight: 3.4, spread: 0.3, cd: 1.6, wt: 4, step: 1, price: 420, pack: 2, track: true,
    desc: 'רחפן מתאבד עם מחפש משלו: ננעל על המטרה שבכוונת ורודף אחריה. מדויקת מאוד.' },
  bomb: { name: 'פצצה מונחית', short: 'פצצה', cls: 3, radius: 17, dmg: 450, light: 1.2, bdmg: 1.6, flight: 4.5, spread: 1.6, cd: 2.5, wt: 12, step: 1, price: 380, pack: 1,
    desc: 'הרס רחב: מפילה מבנים. מסוכנת לאזרחים ולכוחות שקרובים למטרה.' },
  bunker: { name: 'פצצה חודרת', short: 'חודרת', cls: 3, radius: 9, dmg: 320, light: 1, bdmg: 4, flight: 4.8, spread: 1.2, cd: 2.5, wt: 14, step: 1, price: 520, pack: 1,
    desc: 'חודרת לעומק והורסת פירי מנהרות ומחסנים, עם רדיוס פגיעה קטן יחסית.' },
};
const WORDER = ['grenade', 'gun', 'missile', 'loiter', 'bomb', 'bunker'];

const DRONES = {
  wasp: { name: 'צרעה', type: 'רחפן סיור קטן', cls: 1, pay: 14, hp: 60, speed: 30, orbit: 110, sensor: 400, price: 0, repair: 250, stealth: 1,
    desc: 'רחפן קטן וזריז. נושא רימונים ותחמושת משוטטת.' },
  hawk: { name: 'בז', type: 'רחפן תקיפה', cls: 2, pay: 32, hp: 100, speed: 36, orbit: 150, sensor: 470, price: 4500, repair: 600, stealth: 1,
    desc: 'נושא טילים מונחים ומקלע, ועמיד יותר.' },
  eagle: { name: 'עיט', type: 'מזל״ט כבד', cls: 3, pay: 64, hp: 170, speed: 42, orbit: 190, sensor: 560, price: 12000, repair: 1300, stealth: 1,

/* ---------- אוכלוסייה כללית ---------- */
function populateCommon() {
  const Z = ZONES[M.zone], night = M.tod === 'night';
  const civN = Math.round(Z.civ * (night ? 0.35 : 1));
  for (let i = 0; i < civN; i++) { const ed = WD.randEdge(0.2); if (!ed) break; const p = mkP('civ', 'civ', 0, 0, { st: 'walk' }); placeOnEdge(p, ed, rnd(), (chance(.5) ? 1 : -1) * rnd(4.6, 6.2)); }
  for (let i = 0; i < civN / 6; i++) {
    const b = pick(WD.B); if (!b) continue;
    const q = boundaryToward(b, b.x + b.w / 2 + rnd(-30, 30), b.y + b.h / 2 + rnd(-30, 30));
    for (let k = rint(1, 3); k > 0; k--) { let x = q.x + rnd(-2, 2), y = q.y + rnd(-2, 2); if (WD.bAt(x, y, 0.8)) { const f = WD.freeSpot(x, y, 3); x = f.x; y = f.y; } mkP('civ', 'civ', x, y, { st: 'stand', t: rnd(1, 5) }); }
  }
  const carN = Math.round(Z.cars * (night ? 0.5 : 1));
  for (let i = 0; i < carN; i++) { const ed = WD.randEdge(0); if (!ed) break; const v = mkV('civ', 'car', 0, 0, { st: 'drive' }); placeOnEdge(v, ed, rnd(), 2.6); }
}
function placeAA(cx, cy, rad) {
  const lv = M.Df.aa, Z = ZONES[M.zone]; if (!lv) return;
  const sr = v => Math.floor(v + R());   // עיגול אקראי: 0.3 = סיכוי של 30% למקלע אחד
  const hm = sr([0, 1, 1.6, 2, 2.6][lv] * Z.aa), mp = sr([0, 0.35, 0.9, 1.4, 2][lv] * Z.aa * (Z.aa < 0.5 ? 0.5 : 1));
  for (let i = 0; i < hm; i++) { const p = WD.openSpot(cx + rnd(-rad, rad), cy + rnd(-rad, rad), 50); mkS('hmg', p.x, p.y); mkP('enemy', 'rifle', p.x + 2.2, p.y + 1.6, { st: 'post' }); }
  for (let i = 0; i < mp; i++) { const p = WD.freeSpot(cx + rnd(-rad, rad), cy + rnd(-rad, rad), 50); mkP('enemy', 'manpads', p.x, p.y, { st: 'post', passive: true }); }
}

/* ----- סיוע לכוחות ----- */
MIS.cas = {
  setup() {
    let best = null;
    for (let t = 0; t < 90 && !best; t++) {
      const a = WD.randNode(140), b = WD.randNode(140), A = WD.nodes[a], B = WD.nodes[b], d = dist(A.x, A.y, B.x, B.y);
      if (d < 560 || d > 950) continue;
      const r = WD.route(a, b); if (!r || r.length < 4) continue;
      const pts = routePts(r, 3.2), c = polyCum(pts); if (c[c.length - 1] > 1250) continue;
      best = pts;
    }
    if (!best) { const a = WD.randNode(140), b = WD.randNode(140); best = routePts(WD.route(a, b) || [a, b], 3.2); }
    const sq = mkSquad(best, 6, 'נמר', 4.6); M.sq = sq; M.focus = { x: best[0].x, y: best[0].y };
    const mid = pathAt(sq, sq.total / 2); M.area = mid;
    const k = 2 + M.diff;
    for (let i = 0; i < k; i++) {
      const d = sq.total * (0.14 + 0.8 * (i + rnd(0.15, 0.85)) / k), p = pathAt(sq, d), side = chance(.5) ? 1 : -1;
      const n = Math.round((rint(2, 3) + Math.floor(M.diff / 2)) * Math.min(1.3, M.Df.en));
      for (let j = 0; j < n; j++) {
        const o = rnd(24, 52) * side, al = rnd(-22, 22);
        const q = WD.freeSpot(p.x + Math.cos(p.ang) * al + Math.cos(p.ang + Math.PI / 2) * o, p.y + Math.sin(p.ang) * al + Math.sin(p.ang + Math.PI / 2) * o, 6);
        mkP('enemy', j === 0 && M.diff >= 2 && chance(.6) ? 'rpg' : 'rifle', q.x, q.y, { st: 'post' });
      }
    }
    M.techAt = M.diff >= 2 ? sq.total * rnd(0.4, 0.6) : -1;
    M.huntAt = M.diff >= 1 ? sq.total * rnd(0.25, 0.45) : -1;
    placeAA(mid.x, mid.y, 260);
    M.maxDead = [3, 3, 2, 2, 1][M.diff];
    M.timeLeft = (sq.total / sq.spd * 1.6 + 75) * M.Df.time * upv('battery');
    M.objs = [{ id: 'reach', text: 'ליוו את כוח ׳נמר׳ עד נקודת היעד' }, { id: 'loss', text: `שמרו על הכוח: עד ${M.maxDead} הרוגים (0)` }, { id: 'clean', text: 'בונוס: בלי פגיעה באזרחים', opt: true }];
    M.intro = 'כוח ׳נמר׳ (סימונים כחולים) נע בציר הכחול. חסלו את החמושים שמחכים לו בדרך. המשימה נגמרת כשהכוח מגיע ליעד.';
  },
  update() {
    const sq = M.sq;
    if (M.huntAt > 0 && sq.prog >= M.huntAt) { M.huntAt = -1; spawnHunters(sq, 2 + M.diff, 'כוח ׳נמר׳: חמושים מתקרבים מהצד!'); }
    if (M.techAt > 0 && sq.prog >= M.techAt) { M.techAt = -1; spawnTechnical(sq); }
    const dead = M.stats.friendDead, o = M.objs.find(o => o.id === 'loss'), txt = `שמרו על הכוח: עד ${M.maxDead} הרוגים (${dead})`;
    if (o.text !== txt) { o.text = txt; renderObjs(); }
    const pct = Math.round(sq.prog / sq.total * 100), rt = `ליוו את כוח ׳נמר׳ עד נקודת היעד (${pct}%)`, ro = M.objs.find(o => o.id === 'reach');
    if (ro.text !== rt) { ro.text = rt; renderObjs(); }
    if (dead > M.maxDead) { setObj('loss', { fail: true }); return endMission(false, 'הכוח ספג אבדות כבדות מדי'); }
    if (sq.state === 'arrived') {
      setObj('reach', { done: true }); setObj('loss', { done: true });
      if (M.stats.civ === 0) { setObj('clean', { done: true }); M.bonus.push({ text: 'בלי פגיעה באזרחים', f: 0.15 }); }
      if (dead === 0) M.bonus.push({ text: 'בלי אבדות בכוח', f: 0.2 });
      endMission(true);
    }
  },
};

/* ----- חילוץ חטופים ----- */

      for (const b of all) { if (cands.every(o => dist(o.x, o.y, b.x, b.y) > 50)) cands.push(b); if (cands.length >= want) break; }

    for (let i = 0; i < 2; i++) { const e = mkP('enemy', 'guard', H.x + H.w / 2, H.y + H.h / 2, { stay: true, inGuard: true }); enter(e, H, 1e9); }
    const g = Math.round((2 + M.diff) * Math.min(1.4, M.Df.en));
    const ring = a => { const p = boundaryToward(H, H.x + H.w / 2 + Math.cos(a) * 80, H.y + H.h / 2 + Math.sin(a) * 80); return { x: p.x + Math.cos(a) * rnd(2, 9), y: p.y + Math.sin(a) * rnd(2, 9) }; };
    for (let i = 0; i < g; i++) { const a = rnd(TAU), q0 = ring(a), q = WD.bAt(q0.x, q0.y, 1) ? WD.freeSpot(q0.x, q0.y, 4) : q0, e = mkP('enemy', 'guard', q.x, q.y, { st: 'post' }); if (chance(.35)) { const p2 = ring(a + rnd(-0.8, 0.8)); e.patrol = WD.bAt(p2.x, p2.y, 1) ? WD.freeSpot(p2.x, p2.y, 4) : p2; } }
    let armedDecoy = M.diff >= 2;
    for (const cd of M.cands) {

      if (armedDecoy) { armedDecoy = false; for (let i = 0; i < 2; i++) { const a = rnd(TAU), p = boundaryToward(b, b.x + b.w / 2 + Math.cos(a) * 80, b.y + b.h / 2 + Math.sin(a) * 80); mkP('enemy', 'rifle', p.x + Math.cos(a) * 3, p.y + Math.sin(a) * 3, { st: 'post' }); } }
      else if (chance(0.6)) { const p = boundaryToward(b, b.x - 30, b.y + b.h / 2); for (let i = rint(1, 3); i > 0; i--) mkP('civ', 'civ', p.x + rnd(-2, 2), p.y + rnd(-2, 2), { st: 'stand', t: rnd(1, 5) }); }
    }

    M.phase = 'find';

    if (b === M.hb) { c.state = 2; setObj('find', { done: true }); radio(`אומת! החטופים בבניין ${c.letter}. כוח החילוץ יוצא לדרך — חפו עליו`, 'good', true); MIS.rescue.launch(); return 'חטופים'; }

MIS.recon = {

    let cur = WD.randNode(250); const path = [cur]; M.stops = [];
    for (let s = 0; s < nStops; s++) {
      let nb = -1;
      for (let t = 0; t < 100; t++) { const k = WD.randNode(140), A = WD.nodes[k], C = WD.nodes[cur], d = dist(A.x, A.y, C.x, C.y); if (d > 230 && d < 420) { nb = k; break; } }
      if (nb < 0) nb = WD.randNode(140);

      path.push(...r.slice(1)); M.stops.push(path.length - 1); cur = nb;
    }
    if (path.length < 2) { const r = WD.route(cur, WD.randNode(140)); if (r) path.push(...r.slice(1)); M.stops = [path.length - 1]; }
    M.stopDone = [];

    M.tcar = car; M.lock = true; M.lostT = 0; M.lostMax = [25, 20, 16, 12, 9][M.diff];
    M.contactsArmed = 0; M.contactsMarked = 0;
    for (let i = [0, 2, 4, 6, 8][M.diff]; i > 0; i--) { const ed = WD.randEdge(0.1); if (!ed) break; const v = mkV('civ', 'car', 0, 0, { st: 'drive', col: '#ecebe6', decoy: true, vmax: rnd(7, 10) }); placeOnEdge(v, ed, rnd(), 2.6); }

    const mid = WD.nodes[path[Math.floor(path.length / 2)]]; placeAA(mid.x, mid.y, 280);

      { id: 'contacts', text: 'בונוס: סמנו אנשי קשר חמושים (0)', opt: true }, { id: 'strike', text: 'בונוס: השמדת הרכב ביעד הסופי', opt: true, hidden: true }];
    M.intro = 'עקבו אחרי רכב המטרה. אם הוא יוצא מהמסך — מוצאים אותו ומסמנים מחדש. בעצירות סמנו את החמושים.';
  },
  meet(v, final) {

    const n = rint(2, 3), armedN = Math.max(1, Math.round(n * 0.5));

      const e = mkP('enemy', 'contact', src.x, src.y, { st: 'contact', cst: 0, armed: i < armedN, passive: true, car: v, home: b, tx: v.x + rnd(-3.5, 3.5), ty: v.y + rnd(-3.5, 3.5) }); { const q = WD.freeSpot(e.tx, e.ty, 3); e.tx = q.x; e.ty = q.y; }

function updDrone(dt) {

  d.altF += clamp((d.altHigh ? 0.6 : 1) - d.altF, -dt * 0.14, dt * 0.14);
  if (M.type === 'recon' && M.lock && M.tcar.alive) { const k = 1 - Math.exp(-dt * 0.8); d.ocx += (M.tcar.x - d.ocx) * k; d.ocy += (M.tcar.y - d.ocy) * k; }

  radio('הרחפן בדרך למסלול החדש'); SFX.click();
}
function updCam(dt) {
  const sc = scaleNow(), kp = 380 * DPR / sc * dt;

  if (keys.ArrowRight || keys.KeyD) { cam.x += kp; cam.slew = null; }
  if (keys.ArrowUp || keys.KeyW) { cam.y -= kp; cam.slew = null; }
  if (keys.ArrowDown || keys.KeyS) { cam.y += kp; cam.slew = null; }

  for (const e of ents) {

function update(dt) {

let demo = null;

  for (let i = 0; i < 16; i++) { const ed = WD.randEdge(0); if (!ed) break; const v = mkV('civ', 'car', 0, 0, { st: 'drive' }); placeOnEdge(v, ed, rnd(), 2.6); }
  for (let i = 0; i < 50; i++) { const ed = WD.randEdge(0.2); if (!ed) break; const p = mkP('civ', 'civ', 0, 0, { st: 'walk' }); placeOnEdge(p, ed, rnd(), (chance(.5) ? 1 : -1) * rnd(4.6, 6.2)); }

  if (cam.x < 250 || cam.x > WORLD - 250) demo.vx *= -1;
  if (cam.y < 250 || cam.y > WORLD - 250) demo.vy *= -1;

/* =====================================================================

    tag(`אובדן מגע — ${left.toFixed(1)} שניות למציאת המטרה`, cx, wy, left < 5 ? '#ff5a4f' : '#ffb347', 15);
    if (M.lastSeen) edgeArrow(M.lastSeen.x, M.lastSeen.y, '#ffb347', 'נראתה לאחרונה');
  }
  if (M.type === 'rescue' && M.phase === 'breach') tag(`הכוח בתוך הבניין — ${Math.max(0, M.breachT).toFixed(0)}`, cx, wy, '#5cc2ff', 14);
  if (M.type === 'recon' && M.finalT !== undefined && M.finalT > 0) tag(`חלון תקיפה: ${M.finalT.toFixed(0)} שניות`, cx, wy, '#ffd166', 14);
  if (M.endAt && !M.over && M.type === 'strike' && M.hvt && M.hvt.alive && !M.hvt.gone) tag(`בונוס מפקד: ${Math.max(0, M.endAt - M.t).toFixed(0)} שניות`, cx, wy, '#ffd166', 14);

/* ---------- מפה קטנה ---------- */
function drawMini() {
  const m = mctx, k = 240 / WORLD;
  m.setTransform(1, 0, 0, 1, 0, 0); m.drawImage(WD.mini, 0, 0);
  m.setTransform(k, 0, 0, k, 0, 0);
  const lw = 1 / k;
  m.lineWidth = 2 * lw; m.setLineDash([5 * lw, 5 * lw]); m.strokeStyle = 'rgba(94,245,154,0.4)';
  m.beginPath(); m.arc(drone.x, drone.y, drone.D.sensor, 0, TAU); m.stroke();
  m.strokeStyle = 'rgba(255,255,255,0.45)'; m.beginPath(); m.arc(drone.ocx, drone.ocy, drone.orbit, 0, TAU); m.stroke(); m.setLineDash([]);
  const dot = (x, y, r, col) => { m.fillStyle = col; m.beginPath(); m.arc(x, y, r * lw, 0, TAU); m.fill(); };
  if (M.type === 'strike') for (const t of M.targets) if (!(t.k === 'b' ? t.b.ruined : !t.alive)) { m.strokeStyle = '#ffb347'; m.lineWidth = 2 * lw; m.beginPath(); m.arc(t.intel.x, t.intel.y, t.intel.r, 0, TAU); m.stroke(); }
  if (M.type === 'rescue') for (const c of M.cands) dot(c.b.x + c.b.w / 2, c.b.y + c.b.h / 2, 4, c.state === 2 ? '#ff5a4f' : c.state === 1 ? '#7a8a80' : '#ffd166');
  for (const sq of squads) {
    if (sq.state === 'move') { m.strokeStyle = 'rgba(92,194,255,0.8)'; m.lineWidth = 2 * lw; m.beginPath(); const p0 = pathAt(sq, sq.prog); m.moveTo(p0.x, p0.y); for (let i = 1; i < sq.pts.length; i++) if (sq.cum[i] > sq.prog) m.lineTo(sq.pts[i].x, sq.pts[i].y); m.stroke(); }
    const L = squadLead(sq); if (L) dot(L.x, L.y, 4, '#5cc2ff');
  }
  if (M.lz) dot(M.lz.x, M.lz.y, 5, '#5ef59a');
  if (M.hvt && M.hvt.alive && !M.hvt.gone) dot(M.hvt.x, M.hvt.y, 4, '#ffd166');
  if (M.type === 'recon') { if (M.lock) dot(M.tcar.x, M.tcar.y, 4, '#ffd166'); else if (M.lastSeen) dot(M.lastSeen.x, M.lastSeen.y, 4, '#ffb347'); }
  for (const e of ents) if (e.alive && e.marked && e.side === 'enemy' && !e.inside && !e.gone && !e.hvt && e.role !== 'target') dot(e.x, e.y, 2.2, '#ff5a4f');
  const hw = cv.width / 2 / VX.sc, hh = cv.height / 2 / VX.sc;
  m.strokeStyle = '#5ef59a'; m.lineWidth = 2 * lw; m.strokeRect(VX.cx - hw, VX.cy - hh, hw * 2, hh * 2);
  m.save(); m.translate(drone.x, drone.y); m.rotate(drone.heading); m.fillStyle = '#fff';
  m.beginPath(); m.moveTo(9 * lw, 0); m.lineTo(-6 * lw, -6 * lw); m.lineTo(-3 * lw, 0); m.lineTo(-6 * lw, 6 * lw); m.closePath(); m.fill(); m.restore();
}

/* ---------- תדריך ---------- */
let BR = null;
const compatible = did => WORDER.filter(k => WEAPONS[k].cls <= DRONES[did].cls);
const kgTxt = v => (Math.round(v * 10) / 10).toLocaleString('en-US');
const loadKg = L => Object.entries(L).reduce((a, [k, n]) => a + n * WEAPONS[k].wt, 0);
const stockOf = k => WEAPONS[k].free ? Infinity : (S.ammo[k] || 0);
function defaultLoad(did) { // חימוש התחלתי: קצת מכל מה שיש במלאי, ואת השאר ממלאים ברימונים

  add('grenade', Math.min(10, Math.floor(D.pay - loadKg(L))));

}

function renderBrief(keep) {

function computeResult() {

    lines.push([`תגמול משימה (${M.Df.name})`, base]); total += base;
    if (M.card.camp) { const cb = Math.round(base * (CAMP_MULT - 1)); lines.push(['תוספת שלב מערכה', cb]); total += cb;
      if (M.card.stage === CAMPAIGN[M.zone].stages.length - 1 && S.camp[M.zone] <= M.card.stage) { lines.push([`סיום המערכה ב${ZONES[M.zone].name}`, CAMP_BONUS]); total += CAMP_BONUS; } }
    if (M.type !== 'recon') { const tb = Math.round(base * 0.25 * clamp(M.timeLeft / M.total, 0, 1)); if (tb > 0) { lines.push(['בונוס זמן', tb]); total += tb; } }
    for (const b of M.bonus) { const v = Math.round(base * b.f); lines.push([b.text, v]); total += v; }
    if (M.stats.civ) { const p = -Math.round(base * Math.min(0.4, M.stats.civ * 0.08)); lines.push([`פגיעה באזרחים (${M.stats.civ})`, p]); total += p; }
    if (M.stats.ff) { const p = -Math.round(base * Math.min(0.6, M.stats.ff * 0.15)); lines.push([`ירי על כוחותינו (${M.stats.ff})`, p]); total += p; }
  } else lines.push(['המשימה נכשלה — אין תגמול', 0]);

  if (rep > 0) { lines.push([drone.down ? 'שיקום הרחפן שהופל' : 'תיקון נזקים לרחפן', -rep]); total -= rep; }

}

  });
  const ptrs = new Map(); let pinch = null;
  const panBy = (dx, dy) => { const sc = scaleNow(); cam.x -= dx * DPR / sc; cam.y -= dy * DPR / sc; cam.slew = null; };
  cv.addEventListener('pointerdown', e => {
    auInit(); if (!M || paused) return;
    try { cv.setPointerCapture(e.pointerId); } catch (er) { }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false });
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: cam.z, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; a.moved = b.moved = true; }
  });
  cv.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) { if (!p.moved && Math.hypot(p.x - p.sx, p.y - p.sy) > 7) p.moved = true; if (p.moved) panBy(dx, dy); }
    else if (ptrs.size === 2 && pinch) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      cam.zt = cam.z = clamp(pinch.z * d / pinch.d, 1, maxZoom());
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2; panBy(mx - pinch.mx, my - pinch.my); pinch.mx = mx; pinch.my = my;
    }
  });
  const endPtr = e => {
    const p = ptrs.get(e.pointerId); if (!p) return; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
    if (e.type === 'pointerup' && !p.moved && ptrs.size === 0 && performance.now() - p.t < 400 && M && !M.over) {
      const w = s2w(p.x * DPR, p.y * DPR); if (orbitMode) setOrbit(w.x, w.y); else cam.slew = { x: w.x, y: w.y };
    }
  };
  cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
  cv.addEventListener('wheel', e => { e.preventDefault(); if (!M) return; cam.zt = clamp(cam.zt * Math.exp(-e.deltaY * 0.0016), 1, maxZoom()); }, { passive: false });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  addEventListener('keydown', e => {
    if (!M || M.over || (e.target && e.target.tagName === 'INPUT')) return;
    if (paused) { if (e.code === 'KeyP' || e.code === 'Escape') UI.resume(); return; }
    keys[e.code] = true; auInit();
    switch (e.code) {
      case 'Space': e.preventDefault(); if (!e.repeat) { firing = true; fire(false); } break;
      case 'KeyM': doMark(); break; case 'KeyT': toggleThermal(); break; case 'KeyF': deployFlares(false); break;
      case 'KeyH': toggleAlt(); break; case 'KeyO': toggleOrbit(); break; case 'KeyB': callAir(); break;
      case 'KeyP': case 'Escape': UI.pause(); break;
      default: if (/^Digit[1-6]$/.test(e.code)) { const i = +e.code.slice(5) - 1; if (loadout[i]) { selW = i; updWeapRow(); } }
    }
  });
  addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space') firing = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; firing = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && M && !M.over && !paused) UI.pause(); });
}

/* ---------- לולאה ראשית ---------- */
let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)); lastT = t; frameN++;
  try { update(dt); render(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize(); bindInput(); showMenu(); requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
